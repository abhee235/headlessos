<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020616"/>
      <stop offset="40%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="g1" cx="25%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="55%" cy="5%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="80%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#g1)" filter="url(#blur1)"/>
  <rect width="1920" height="1080" fill="url(#g2)" filter="url(#blur1)"/>
  <rect width="1920" height="1080" fill="url(#g3)" filter="url(#blur2)"/>
  <ellipse cx="960" cy="120" rx="700" ry="180" fill="#10b981" fill-opacity="0.07" filter="url(#blur2)"/>
  <ellipse cx="600" cy="80" rx="400" ry="120" fill="#34d399" fill-opacity="0.06" filter="url(#blur2)"/>
  <!-- Stars -->
  <circle cx="120" cy="200" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="340" cy="450" r="0.5" fill="white" opacity="0.3"/>
  <circle cx="780" cy="380" r="0.7" fill="white" opacity="0.35"/>
  <circle cx="1100" cy="550" r="0.6" fill="white" opacity="0.25"/>
  <circle cx="1400" cy="300" r="0.9" fill="white" opacity="0.4"/>
  <circle cx="1600" cy="650" r="0.5" fill="white" opacity="0.3"/>
  <circle cx="1800" cy="180" r="0.7" fill="white" opacity="0.35"/>
  <circle cx="500" cy="700" r="0.6" fill="white" opacity="0.2"/>
  <circle cx="200" cy="900" r="0.8" fill="white" opacity="0.3"/>
