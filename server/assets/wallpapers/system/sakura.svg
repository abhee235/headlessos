<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="25%" stop-color="#2d1228"/>
      <stop offset="45%" stop-color="#3d1a35"/>
      <stop offset="65%" stop-color="#2a1530"/>
      <stop offset="100%" stop-color="#1a0e20"/>
    </linearGradient>
    <radialGradient id="p1" cx="40%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2" cx="65%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3" cx="25%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p4" cx="50%" cy="50%" r="25%">
      <stop offset="0%" stop-color="#ffc0cb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffc0cb" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
    <!-- Petal dots -->
    <pattern id="petals" x="0" y="0" width="35" height="35" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="0.5" fill="#ffc0cb" opacity="0.02"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#p1)"/>
  <rect width="1920" height="1080" fill="url(#p2)"/>
  <rect width="1920" height="1080" fill="url(#p3)"/>
  <rect width="1920" height="1080" fill="url(#p4)" filter="url(#blur)"/>
  <rect width="1920" height="1080" fill="url(#petals)"/>
</svg>
