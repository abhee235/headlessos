# CI — typecheck and test (M14.4)
#
# Runs on every pull request, on pushes to main, and before a release build
# (release.yml calls this workflow first, so a tag on failing code builds nothing).
#
# Vitest and tsx strip types without checking them, so the typechecks run too.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # shared is a composite TS project: server and client tsc need shared/dist
      - name: Build shared workspace
        run: npm run build --workspace=shared

      - name: Typecheck server
        run: npx tsc --noEmit -p server

      - name: Typecheck client
        run: npx tsc --noEmit -p client

      - name: Test server
        run: npm run test:server

      - name: Test client
        run: npm run test:client
