# Release Desktop App
#
# Triggers when a version tag (e.g. v1.2.3) is pushed.
# M14.4: first runs CI (typechecks and tests); nothing is built if it fails.
# Builds macOS (universal: arm64 + x64), Windows (x64) and Linux (x64) binaries,
# then creates a draft GitHub Release with all artifacts attached.
#
# Usage:
#   git tag v1.2.3
#   git push origin v1.2.3
#
# M15.5: Actions → Run workflow builds every platform from a branch and keeps the
# files as run artifacts. Only a tag creates a release.
#
# Optional code signing (set in repo Settings → Secrets):
#   macOS:   APPLE_CSC_LINK, APPLE_CSC_KEY_PASSWORD, APPLE_ID,
#            APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD

name: Release Desktop App

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write # required to create a GitHub Release

jobs:
  # ── Checks (M14.4) ─────────────────────────────────────────────────────────
  check:
    name: Typecheck and test
    uses: ./.github/workflows/ci.yml

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS (universal)
    needs: check
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Install root workspaces (shared, server, client) + their deps
      - name: Install root dependencies
        run: npm ci

      # shared must be compiled before client's tsc project references resolve
      - name: Build shared workspace
        run: npm run build --workspace=shared

      # Vite build → client/dist/  (picked up by electron extraResources)
      - name: Build client (React + Vite)
        run: npm run build --workspace=client
        # Node sizes its default heap from the runner's RAM: about 2 GB on the 7 GB macOS
        # runner, and the client build needs more (v0.2.0 ran out of memory there)
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # electron workspace has its own esbuild + electron-builder devDeps
      - name: Install electron workspace dependencies
        working-directory: electron
        run: npm ci

      # esbuild → electron/server.mjs  (single-file ESM bundle, no native addons)
      - name: Bundle server
        working-directory: electron
        run: npm run build:server

      # electron-builder downloads both arm64 and x64 Electron and lipo-merges them
      # into a single universal .dmg that runs on both Apple Silicon and Intel Macs.
      - name: Package macOS app (universal .dmg + .zip)
        working-directory: electron
        # Unset CSC_LINK when the secret is absent: GitHub sets it to "" which
        # electron-builder resolves as a path (cwd = electron/) → "not a file" crash.
        # With no CSC_LINK and CSC_IDENTITY_AUTO_DISCOVERY=false the build is unsigned.
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK || true
          npx electron-builder --mac --universal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # M17.2: the app's own identity (electron/scripts/mac-identity.js), checked before any upload.
      # Its UUID must differ from Electron's own binary, and the changed executable must still start.
      - name: Check the macOS app's signature and UUIDs
        working-directory: electron
        env:
          APPLE_SIGNED: ${{ secrets.APPLE_CSC_LINK != '' }}
        run: |
          app="dist/mac-universal/HeadlessOS.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          info=$(codesign -dv "$app" 2>&1)
          echo "$info"
          echo "$info" | grep -qx 'Identifier=com.headlessos.app'
          if [ "$APPLE_SIGNED" != "true" ]; then echo "$info" | grep -qx 'Signature=adhoc'; fi
          ours=$(dwarfdump --uuid --arch=arm64 "$app/Contents/MacOS/HeadlessOS" | awk '{ print $2 }')
          stock=$(dwarfdump --uuid --arch=arm64 node_modules/electron/dist/Electron.app/Contents/MacOS/Electron | awk '{ print $2 }')
          echo "arm64 UUID: HeadlessOS $ours, Electron $stock"
          [ -n "$ours" ] && [ -n "$stock" ] && [ "$ours" != "$stock" ]
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/HeadlessOS" -e 'console.log("starts, Electron " + process.versions.electron)'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
          if-no-files-found: error
          retention-days: 1

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    needs: check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run build --workspace=shared

      - name: Build client (React + Vite)
        run: npm run build --workspace=client
        # Node sizes its default heap from the runner's RAM: about 2 GB on the 7 GB macOS
        # runner, and the client build needs more (v0.2.0 ran out of memory there)
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install electron workspace dependencies
        working-directory: electron
        run: npm ci

      - name: Bundle server
        working-directory: electron
        run: npm run build:server

      # Produces: NSIS installer (.exe) + portable (.exe) in electron/dist/
      - name: Package Windows app (NSIS installer + portable)
        working-directory: electron
        run: |
          if ([string]::IsNullOrEmpty($env:WIN_CSC_LINK)) { Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue }
          npx electron-builder --win --x64
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-dist
          path: electron/dist/*.exe
          if-no-files-found: error
          retention-days: 1

  # ── Linux (M15.5) ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (x64)
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run build --workspace=shared

      - name: Build client (React + Vite)
        run: npm run build --workspace=client
        # Node sizes its default heap from the runner's RAM: about 2 GB on the 7 GB macOS
        # runner, and the client build needs more (v0.2.0 ran out of memory there)
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install electron workspace dependencies
        working-directory: electron
        run: npm ci

      - name: Bundle server
        working-directory: electron
        run: npm run build:server

      # Produces: AppImage + deb in electron/dist/
      - name: Package Linux app (AppImage + deb)
        working-directory: electron
        run: npx electron-builder --linux --x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
          if-no-files-found: error
          retention-days: 1

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-mac, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # M17.1: id-token and attestations let the job attest where the files came from
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-dist
          path: release-assets/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-dist
          path: release-assets/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets/

      # M17.1: GitHub turns a space in a file name into a dot, so the files get those names first
      # and SHA256SUMS matches what people download. The install scripts check against it.
      - name: Name the files as GitHub will
        run: |
          cd release-assets
          for f in *' '*; do
            [ -e "$f" ] || continue
            mv -- "$f" "${f// /.}"
          done
          ls -lh

      - name: SHA256SUMS
        run: |
          cd release-assets
          sha256sum -- *.dmg *.zip *.exe *.AppImage *.deb > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Provenance, that this workflow built these files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      # Creates a DRAFT release — review and publish manually in GitHub UI.
      # generate_release_notes auto-writes a changelog from merged PRs / commits.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## HeadlessOS ${{ github.ref_name }}

            [Website](https://headlessos.com) · [Documentation](https://headlessos.com/docs/introduction) · [Blog](https://headlessos.com/blog)

            ### Install with one command

            On a Mac, in Terminal:

            ```
            curl -fsSL https://raw.githubusercontent.com/abhee235/headlessos/main/install.sh | sh
            ```

            On Windows, in PowerShell:

            ```
            irm https://raw.githubusercontent.com/abhee235/headlessos/main/install.ps1 | iex
            ```

            Each checks the download against this release's `SHA256SUMS`, installs for your account only, and
            skips the first-launch warnings below. Run it again to update.

            ### Download

            | Platform | File | Notes |
            |----------|------|-------|
            | macOS (Apple Silicon + Intel) | `HeadlessOS-*-universal.dmg` | Universal binary — works on both M-series and Intel Macs |
            | macOS (zip) | `HeadlessOS-*-universal-mac.zip` | For manual installation |
            | Windows (installer) | `HeadlessOS.Setup.*.exe` | Recommended — installs for your user |
            | Windows (portable) | `HeadlessOS.*.exe` | No installation needed |
            | Linux (AppImage) | `HeadlessOS-*.AppImage` | Runs on most distributions |
            | Linux (deb) | `headlessos-desktop_*.deb` | Debian and Ubuntu |

            > **macOS note:** The app isn't signed by Apple, so macOS blocks the first launch of a download. Open
            > it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. If macOS
            > says the app "is damaged", run `xattr -cr /Applications/HeadlessOS.app` in Terminal and open it
            > again. When macOS asks for your password so HeadlessOS can open its Keychain item, enter it and
            > click **Always Allow**. If any other app asks for "HeadlessOS Safe Storage", click **Deny**.
            > When you connect to a device on your local network, allow HeadlessOS to find devices on it.
            > macOS can ask for the Keychain again after each update or reinstall, and about the local
            > network after an update.
            >
            > **Windows note:** The installer is not signed. If SmartScreen shows "Windows protected your PC",
            > click **More info → Run anyway**.
            >
            > **Linux note:** Make the AppImage executable with `chmod +x`, then run it, or install the
            > `.deb` with your package manager.
